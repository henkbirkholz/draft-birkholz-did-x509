name: Checks

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.21.0

      - name: Install dependencies
        run: |
            set -ex
            sudo gem install kramdown-rfc:1.7.43 cddlc:0.4.5
            pip install abnf-to-regexp==1.2.0 xml2rfc==3.34.1
            commit=$(cat tests/samples/UPSTREAM_COMMIT)
            pip install -r "https://raw.githubusercontent.com/microsoft/did-x509/$commit/requirements.txt"
            pip install "git+https://github.com/microsoft/did-x509@$commit"

      - name: Extract Figures
        run: |
            set -ex
            make draft-birkholz-did-x509.xml
            kramdown-rfc-extract-sourcecode -t files -d figures draft-birkholz-did-x509.xml

      - name: ABNF Compliance
        run: |
            set -ex
            cat figures/abnf/*.abnf > all.abnf
            abnf-to-regexp -i all.abnf --format python-nested

      - name: CDDL Compliance
        run: |
            set -ex
            cddlc -r figures/cddl/*.cddl

      - name: JSON Compliance
        run: |
            set -ex
            for f in figures/json/*.json; do
              jq . "$f"
            done

      - name: Rego Compliance
        run: |
            set -ex
            pytest tests/test_rego_policy.py -v

      - name: Upstream Pin
        run: |
            set -ex
            pytest tests/test_upstream_pin.py -v
